name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Trilha BACKEND: lint-backend -> build-backend -> test-backend
  # ---------------------------------------------------------------------------
  lint-backend:
    name: lint-backend (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências de lint
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formatação)
        run: ruff format --check .

  build-backend:
    name: build-backend (container + django check)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Build da imagem
        run: docker build -t backend-ci -f Dockerfile .

      - name: Validação do container
        run: docker run --rm backend-ci python manage.py check

      - name: Build da imagem de produção
        run: docker build -t backend-prod-ci -f Dockerfile.prod .

      - name: Validação da imagem de produção (usuário não-root, sem pip)
        run: |
          test "$(docker run --rm backend-prod-ci whoami)" = "django"
          if docker run --rm backend-prod-ci sh -c 'command -v pip'; then
            echo "pip não deveria existir na imagem de produção"; exit 1
          fi
          docker image ls backend-prod-ci

  test-backend:
    name: test-backend (manage.py test)
    runs-on: ubuntu-latest
    needs: build-backend
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_db
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_DB: ci_db
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python manage.py test --verbosity 2

  # ---------------------------------------------------------------------------
  # Trilha FRONTEND: lint-frontend -> build-frontend -> test-frontend
  # ---------------------------------------------------------------------------
  lint-frontend:
    name: lint-frontend (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

  build-frontend:
    name: build-frontend (next build + container)
    runs-on: ubuntu-latest
    needs: lint-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Next build
        run: npm run build

      - name: Build da imagem
        run: docker build -t frontend-ci -f Dockerfile .

      - name: Build da imagem de produção
        run: docker build -t frontend-prod-ci -f Dockerfile.prod .

      - name: Validação da imagem de produção (< 150 MB, usuário nextjs)
        run: |
          SIZE=$(docker image inspect -f '{{.Size}}' frontend-prod-ci)
          echo "Tamanho da imagem: $((SIZE / 1024 / 1024)) MB"
          test "$SIZE" -lt $((150 * 1024 * 1024))
          test "$(docker run --rm frontend-prod-ci whoami)" = "nextjs"

  test-frontend:
    name: test-frontend (vitest)
    runs-on: ubuntu-latest
    needs: build-frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Vitest
        run: npm test
